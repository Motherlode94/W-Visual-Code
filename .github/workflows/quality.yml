name: W Visual Code checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify production assets
        run: |
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/src/project.js
          test -s dist/src/autocomplete.js
          test -s dist/src/autocomplete-ui.js
          test -s dist/style.css
